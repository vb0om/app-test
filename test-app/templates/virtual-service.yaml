{{- if .Values.istio.egress_hosts }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-virtual-service
  namespace: {{ .Release.Namespace }}
spec:
  exportTo:
  - "."
  - {{ .Values.istio.egress_namespace }}
  hosts:
  {{- range .Values.istio.egress_hosts }}
  - {{ . | quote }}
  {{- end }}
  gateways:
  - mesh
  - {{ .Values.istio.egress_namespace }}/{{ .Values.istio.egress_gateway }}
  http:
  - match:
    - gateways:
      - mesh
      port: 80
    route:
    - destination:
        host: {{ .Values.istio.egress_gateway }}.{{ .Values.istio.egress_namespace }}.svc.cluster.local
        port:
          number: 80
      weight: 100
  {{- range .Values.istio.egress_hosts }}
  - match:
    - gateways:
      - {{ $.Values.istio.egress_namespace }}/{{ $.Values.istio.egress_gateway }}
      port: 80
      authority:
        exact: {{ . | quote }}
    route:
    - destination:
        host: {{ . | quote }}
        port:
          number: 80
      weight: 100
  {{- end }}
  tls:
  - match:
    - gateways:
      - mesh
      port: 443
      sniHosts:
      {{- range .Values.istio.egress_hosts }}
      - {{ . | quote }}
      {{- end }}
    route:
    - destination:
        host: {{ .Values.istio.egress_gateway }}.{{ .Values.istio.egress_namespace }}.svc.cluster.local
        port:
          number: 443
  {{- range .Values.istio.egress_hosts }}
  - match:
    - gateways:
      - {{ $.Values.istio.egress_namespace }}/{{ $.Values.istio.egress_gateway }}
      port: 443
      sniHosts:
      - {{ . | quote }}
    route:
    - destination:
        host: {{ . | quote }}
        port:
          number: 443
      weight: 100
  {{- end }}
{{- end }}
