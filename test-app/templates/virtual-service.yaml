{{- if .Values.istio.egress_hosts }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-virtual-service
  namespace: {{ .Values.istio.egress_namespace }}
spec:
  hosts:
  {{- range .Values.istio.egress_hosts }}
  - {{ . | quote }}
  {{- end }}
  gateways:
  - mesh
  - {{ .Values.istio.egress_gateway }}
  http:
  - match:
    - gateways:
      - mesh
      port: 80
    route:
    - destination:
        host: {{ .Values.istio.egress_gateway }}.{{ .Values.istio.egress_namespace }}.svc.cluster.local
        subset: {{ .Release.Name }}-service-entry
        port:
          number: 80
      weight: 100
  - match:
    - gateways:
      - {{ .Values.istio.egress_gateway }}
      port: 80
    route:
    {{- range .Values.istio.egress_hosts }}
    - destination:
        host: {{ . | quote }}
        port:
          number: 80
      weight: 100
    {{- end }}
  tls:
  - match:
    - gateways:
      - mesh
      port: 443
      sniHosts:
      {{- range .Values.istio.egress_hosts }}
      - {{ . | quote }}
      {{- end }}
    route:
    - destination:
        host: {{ .Values.istio.egress_gateway }}.{{ .Values.istio.egress_namespace }}.svc.cluster.local
        subset: {{ .Release.Name }}-service-entry
        port:
          number: 443
  - match:
    - gateways:
      - {{ .Values.istio.egress_gateway }}
      port: 443
      sniHosts:
      {{- range .Values.istio.egress_hosts }}
      - {{ . | quote }}
      {{- end }}
    route:
    {{- range .Values.istio.egress_hosts }}
    - destination:
        host: {{ . | quote }}
        port:
          number: 443
      weight: 100
    {{- end }}
{{- end }}
