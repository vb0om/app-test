# Default values for test_app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "stable"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  container_port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: demo-app-1.maddevs.org
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# VolumeMounts and Volumes of configmaps to the output Deployment definition.
volumeMounts:
  - name: nginx-html
    mountPath: /usr/share/nginx/html
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Set true if needs networkpolicy for istio service mesh
networkpolicy_istio_injection: false

# Define ingress\egress rule for the current deployment via networkpolicy
additional_network_policy: {}
  # Ingress from list of namespaces
  # ingress:
  #   namespaces:
  #   - name: "monitoring"
  #   - name: "ingress-nginx"
  #   - name: "app-2"
  # Egress
  # egress:
  #   namespaces:
  #   - name: "istio-system"
  #     ports: 
  #     - 8080
  #     - 8443

pageContent: |
  "<h1>Welcome to Test Application </h1>"

# Istio resources
istio: {}
